<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Desa Majelis Hidayah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Library Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#0a2622; --bg-2:#0e312b; --panel:#13403a; --panel-2:#1b5249; --line:rgba(238,243,236,.16);
  --fg:#eef3ec; --muted:#a4bfb5; --gold:#e3b04b; --gold-ink:#2a1d00;
  --ok:#5bd39b; --info:#74b9ea; --warn:#f2a65a; --bad:#f07168; --idle:#86a198;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
body.idle{cursor:none}
*{box-sizing:border-box}
#fitwrap{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23e3b04b' stroke-opacity='.07' stroke-width='1.5'><rect x='30' y='30' width='60' height='60'/><rect x='30' y='30' width='60' height='60' transform='rotate(45 60 60)'/></g></svg>")}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hdr{position:absolute;left:0;right:0;top:0;height:112px;padding:0 64px;display:flex;align-items:center;gap:24px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.logo{width:78px;height:78px;flex:none;color:var(--gold);display:grid;place-items:center}
.logo svg,.logo img{width:100%;height:100%;object-fit:contain}
.hid{flex:1;min-width:0}
.t1{font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
.t2{font-family:var(--f-display);font-size:54px;font-weight:800;line-height:1.02;white-space:nowrap}
.t3{font-size:21px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clockbox{text-align:right}
#clk{font-family:var(--f-display);font-size:58px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#dt{font-size:22px;color:var(--muted);margin-top:4px}
.sample{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:.2em;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 14px}

/* Tabs */
.tabs{position:absolute;left:0;right:0;top:112px;height:64px;padding:0 64px;display:flex;align-items:center;gap:12px}
.tab{height:44px;padding:0 22px;border-radius:999px;display:flex;align-items:center;font-size:22px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:transparent;font-family:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.pz{margin-left:auto;font-size:20px;color:var(--gold);font-weight:600;flex:none}
a.tab{text-decoration:none;color:var(--gold);border-color:var(--gold)}
a.tab:hover{background:rgba(227,176,75,.15)}
#lg{position:fixed;inset:0;z-index:110;background:rgba(3,14,12,.88);display:grid;place-items:center;padding:16px;font-family:var(--f-body)}
.lgb{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;color:var(--fg)}
.lgb h2{margin:0 0 4px;font-family:var(--f-display);font-size:26px}
.lgb p{margin:0 0 18px;color:var(--muted);font-size:15px}
.lgb label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:12px}
.lgb input{font:inherit;font-size:17px;color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;min-width:0}
.lgb input:focus-visible,.lgb button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lgb .err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:8px}
.lgb .row{display:flex;gap:10px;justify-content:flex-end}

/* Slides */
.main{position:absolute;left:0;right:0;top:176px;bottom:84px}
.slide{position:absolute;left:64px;right:64px;top:20px;bottom:12px;opacity:0;visibility:hidden;transition:opacity .6s ease}
.slide.on{opacity:1;visibility:visible}
.sh{display:flex;align-items:baseline;justify-content:space-between;height:64px;gap:24px}
.sh h2{margin:0;font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1}
.sh .sub{font-size:23px;color:var(--muted)}
.eyebrow{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 34px;min-width:0}
.av{width:84px;height:84px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-weight:800;font-size:34px;display:grid;place-items:center;flex:none}
.av.lg{width:100px;height:100px;font-size:40px}
.av.sm{width:64px;height:64px;font-size:26px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Galeri */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;height:calc(100% - 78px)}
.gt{position:relative;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);min-height:0}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gt .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);opacity:.3}
.gt .ph svg{width:120px;height:120px}
.gc{position:absolute;left:0;right:0;bottom:0;padding:56px 24px 18px;background:linear-gradient(to top,rgba(5,20,18,.9),rgba(5,20,18,0))}
.gc b{display:block;font-size:27px;line-height:1.2;font-weight:700;color:#fff}
.gc span{font-size:19px;color:#cfe0d8}

/* Sosial media */
.smg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:20px;height:calc(100% - 78px)}
.smc{display:flex;align-items:center;gap:30px;padding:22px 30px;background:var(--panel);border:1px solid var(--line);border-radius:22px;min-width:0}
.qr{width:200px;height:200px;flex:none;background:#fff;border-radius:14px;padding:12px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.qr.none{background:var(--bg-2);border:1px dashed var(--line);color:var(--gold);font-family:var(--f-display);font-size:84px;font-weight:800}
.smc>div:last-child{min-width:0}
.smc .ak{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1.1;margin-top:6px;overflow-wrap:anywhere}
.smc .ul{font-size:21px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.nm{font-size:27px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.jb{font-size:21px;color:var(--gold);font-weight:600;margin-top:3px}
.empty{color:var(--muted);font-size:26px;padding:40px 0}

/* Beranda */
.home{display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:32px;height:100%}
.home .l{display:grid;grid-template-rows:auto 1fr;gap:26px;min-height:0}
.hero{display:flex;flex-direction:column;gap:22px}
.quote{font-family:var(--f-display);font-size:37px;line-height:1.3;font-weight:600;margin:0;text-wrap:pretty}
.sig{display:flex;align-items:center;gap:22px}
.agenda{display:flex;flex-direction:column;min-height:0}
.arow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:22px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.dd{text-align:center;border-right:1px solid var(--line);padding-right:18px}
.dd b{display:block;font-family:var(--f-display);font-size:50px;line-height:1;color:var(--gold)}
.dd span{font-size:19px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.at{font-size:28px;font-weight:700;line-height:1.2}
.ap{font-size:21px;color:var(--muted);margin-top:3px}
.home .r{display:grid;grid-template-rows:auto 1fr;gap:26px;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.stat{border-top:3px solid var(--gold);padding-top:10px}
.stat b{display:block;font-family:var(--f-display);font-size:62px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:21px;color:var(--muted)}
.svc{display:flex;flex-direction:column;gap:16px}
.svc .tag{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.25;color:var(--gold)}
.svc dl{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;font-size:23px}
.svc dt{color:var(--muted)}
.svc dd{margin:0;font-weight:600}

/* Berita */
.news{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;height:100%}
.feat{display:flex;flex-direction:column;gap:22px;padding:44px;background:var(--panel);border-radius:26px;border:1px solid var(--line)}
.chip{align-self:flex-start;background:var(--gold);color:var(--gold-ink);padding:6px 18px;border-radius:999px;font-weight:800;font-size:19px;letter-spacing:.1em;text-transform:uppercase}
.feat h3{font-family:var(--f-display);font-size:58px;line-height:1.07;margin:0;font-weight:800;text-wrap:balance}
.meta{font-size:22px;color:var(--muted)}
.feat p{font-size:28px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.nlist{display:flex;flex-direction:column;min-height:0}
.nitem{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;border-bottom:1px solid var(--line);min-height:0;overflow:hidden}
.nitem:last-child{border-bottom:0}
.nitem h4{margin:0;font-family:var(--f-display);font-size:32px;line-height:1.18;font-weight:700}
.nitem .k{font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* Anggaran */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 26px;min-width:0}
.tile .lb{font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .vl{font-family:var(--f-display);font-size:52px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .sb{font-size:20px;color:var(--muted);margin-top:4px}
.bar{height:9px;border-radius:9px;background:rgba(238,243,236,.14);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:22px}
.tb h3{margin:0 0 6px;font-family:var(--f-display);font-size:30px;font-weight:800}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 176px 176px 120px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:22px}
.brow.h{font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 0 8px}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
.brow.t{border-top:2px solid var(--gold);border-bottom:0;font-weight:800;font-size:23px}
.brow .p{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.brow .p .bar{margin-top:4px;height:7px}

/* Perangkat */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:18px;height:calc(100% - 78px)}
.pcard{display:flex;align-items:center;gap:20px;padding:16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:20px;min-width:0}
.pcard.first{grid-column:span 2;border-color:var(--gold)}
.pcard.first .av{width:100px;height:100px;font-size:40px}
.pcard.first .nm{font-size:34px}
.pcard>div:last-child{min-width:0}

/* Kehadiran */
.att{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:32px;height:calc(100% - 68px)}
.atbl{display:flex;flex-direction:column;min-height:0}
.late{margin-left:8px;font-size:17px;font-weight:700;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:2px 10px;white-space:nowrap}
.ar{display:grid;grid-template-columns:minmax(0,1.5fr) 270px 90px 90px 210px;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.ar.h{font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;height:38px}
.rows{flex:1;display:flex;flex-direction:column;min-height:0}
.rows .ar{flex:1 1 0;max-height:64px;min-height:0}
.ar .n{font-size:24px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .j{font-size:18px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .tm{font-size:23px;font-variant-numeric:tabular-nums}
.ar .rk{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.ar .rk .bar{margin-top:4px;height:7px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:3px 16px 3px 12px;border-radius:999px;font-weight:700;font-size:21px;background:rgba(255,255,255,.08);background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);white-space:nowrap}
.pill:before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c)}
.c-ok{--c:var(--ok)}.c-info{--c:var(--info)}.c-gold{--c:var(--gold)}.c-warn{--c:var(--warn)}.c-bad{--c:var(--bad)}.c-idle{--c:var(--idle)}
.side{display:flex;flex-direction:column;align-items:center;gap:22px}
.donut{width:290px;height:290px;border-radius:50%;display:grid;place-items:center;flex:none}
.hole{width:210px;height:210px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
.hole b{font-family:var(--f-display);font-size:68px;line-height:1;font-weight:800;display:block}
.hole span{font-size:19px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.leg{width:100%;display:flex;flex-direction:column;gap:8px}
.leg div{display:flex;justify-content:space-between;align-items:center;font-size:23px}
.leg b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.stale{width:100%;font-size:19px;color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:8px 14px;text-align:center}

/* BPD & PKK */
.lead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.pc{display:flex;align-items:center;gap:22px;padding:22px 26px;background:var(--panel);border:1px solid var(--line);border-radius:20px;min-width:0}
.pc.big{border-color:var(--gold)}
.pc>div:last-child{min-width:0}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:18px}
.mem .pc{padding:16px 22px}
.fn{margin-top:22px;display:flex;gap:28px;align-items:center}
.fn p{margin:0;font-size:27px;line-height:1.45}
.pkk{display:grid;grid-template-columns:600px minmax(0,1fr);gap:32px;height:calc(100% - 68px)}
.pk-l{display:grid;grid-template-rows:repeat(4,1fr);gap:16px}
.pk-r{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px}
.pokja{display:flex;flex-direction:column;gap:6px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 26px;min-width:0}
.pokja .bd{font-size:21px;color:var(--muted);line-height:1.3}
.pokja .kt{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px}
.pokja .pr{font-size:21px;line-height:1.35;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

/* Footer */
.ftr{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:stretch;background:var(--bg-2);border-top:1px solid var(--line)}
.ftr .lbl{padding:0 34px;display:flex;align-items:center;background:var(--gold);color:var(--gold-ink);font-weight:800;letter-spacing:.2em;font-size:22px}
.ticker{flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.run{display:inline-block;padding-left:100%;font-size:28px;animation:run var(--dur,60s) linear infinite}
.run em{color:var(--gold);font-style:normal;padding:0 28px}
@keyframes run{to{transform:translateX(-100%)}}
.prog{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--gold)}
@keyframes prog{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.run{animation:none;padding-left:24px}}

/* Editor */
#editBtn{position:fixed;right:16px;bottom:16px;z-index:60;font:600 14px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;opacity:.4}
#editBtn:hover,#editBtn:focus-visible{opacity:1}
body.idle #editBtn{opacity:0}
#ed{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-size:16px;line-height:1.4}
.ed-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg-2)}
.ed-top .ttl{font-family:var(--f-display);font-weight:800;font-size:20px;margin-right:12px}
.ed-body{flex:1;overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 90px}
.ed-in{max-width:1080px;margin:0 auto}
.ed-in h3{font-family:var(--f-display);font-size:22px;margin:24px 0 10px}
.ed-in h3:first-child{margin-top:0}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.btn{font:600 14px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--panel-2)}
.btn.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.s{padding:4px 10px}
.btn.bad{color:var(--bad)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f.w{grid-column:1/-1}
label.f.ck{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--fg)}
#ed input,#ed select,#ed textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
#ed input[type=checkbox]{width:20px;height:20px}
#ed textarea{resize:vertical}
#ed button:focus-visible,#ed input:focus-visible,#ed select:focus-visible,#ed textarea:focus-visible,#editBtn:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg-2)}
.item .fgrid label.f input,.item .fgrid label.f select,.item .fgrid label.f textarea{background:var(--bg)}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ih span{display:flex;gap:6px}
.lh{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}
.lh h3{margin:0}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stt{color:var(--ok);font-size:14px;min-height:20px}
.fgrid .pf{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.pv{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

function clone(o){return JSON.parse(JSON.stringify(o));}
function merge(base,src){
  for(var k in src){
    if(!Object.prototype.hasOwnProperty.call(src,k))continue;
    var v=src[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])){merge(base[k],v);}
    else base[k]=v;
  }
  return base;
}

function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){var raw=JSON.parse(s);return merge(clone(DEFAULT),raw);}
  }catch(e){}
  return clone(DEFAULT);
}

/* ===== Helper ===== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=Number(v);return isFinite(n)?n:0;}
function rp(n){return num(n).toLocaleString('id-ID');}
function compact(n){
  var s=n<0?'−':'',a=Math.abs(n);
  if(a>=1e9)return s+'Rp '+(a/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';
  if(a>=1e6)return s+'Rp '+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';
  return s+'Rp '+rp(a);
}
function pct(r,p){return p>0?Math.round(num(r)/num(p)*100):0;}
function sum(arr,k){return (arr||[]).reduce(function(a,x){return a+num(x[k]);},0);}
function ini(name){
  var w=String(name||'').replace(/,.*$/,'').split(/\s+/).filter(function(x){return x&&x.indexOf('.')<0;});
  return esc(((w[0]||'?').charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase());
}
function fd(iso,opt){
  if(!iso)return '';
  var d=new Date(iso+'T00:00:00');if(isNaN(d))return esc(iso);
  return d.toLocaleDateString('id-ID',opt||{day:'numeric',month:'long',year:'numeric'});
}
function todayISO(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
function avHTML(x,cls){
  x=x||{};
  return '<div class="av'+(cls?' '+cls:'')+'">'+(x.foto?'<img alt="" src="'+esc(x.foto)+'">':ini(x.nama))+'</div>';
}
function qrSvg(url){
  try{
    if(!url||typeof qrcode!=='function')return '';
    var q=qrcode(0,'M');q.addData(url);q.make();
    var s;
    try{s=q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e1){s=q.createSvgTag(4,0);}
    if(s&&s.indexOf('viewBox')<0){
      var m=s.match(/width="(\d+)"[^>]*height="(\d+)"/);
      if(m)s=s.replace('<svg','<svg viewBox="0 0 '+m[1]+' '+m[2]+'"').replace(/ width="\d+"/,'').replace(/ height="\d+"/,'');
    }
    return s||'';
  }catch(e){return '';}
}
function lines(s){return String(s||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);}

/* ===== Slide ===== */
function head(t,sub){return '<div class="sh"><h2>'+esc(t)+'</h2><div class="sub">'+sub+'</div></div>';}
function dash(v){return esc(v)||'–';}

  var stats=[['penduduk','Penduduk (jiwa)'],['kk','Kepala Keluarga'],['luas','Luas Wilayah (km²)'],['dusun','Dusun'],['rt','RT'],['rw','RW']];
  var ag=(data.agenda||[]).slice(0,4).map(function(a){
    var d=a.tanggal?new Date(a.tanggal+'T00:00:00'):null,ok=d&&!isNaN(d);
    return '<div class="arow"><div class="dd"><b class="num">'+(ok?d.getDate():'')+'</b><span>'+(ok?d.toLocaleDateString('id-ID',{month:'short'}):'')+'</span></div>'+
      '<div><div class="at">'+esc(a.kegiatan)+'</div><div class="ap">'+esc(a.tempat)+'</div></div></div>';
  }).join('')||'<div class="empty">Belum ada agenda.</div>';
  var quote=p.sambutan||('Selamat datang di Pemerintah Desa '+p.namaDesa+'.');
  var sig=p.kades?'<div class="sig">'+avHTML({nama:p.kades,foto:(data.perangkat&&data.perangkat[0]&&data.perangkat[0].foto)||''},'lg')+'<div><div class="nm">'+esc(p.kades)+'</div><div class="jb">Kepala Desa '+esc(p.namaDesa)+'</div></div></div>':'';
  var rows=[['Jam pelayanan',p.jamLayanan],['Alamat',p.alamat],['Kontak',p.telp]].filter(function(r){return r[1];});

    (rows.length?'<dl>'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>':'')+'</section>':'';

    '<section class="card hero"><div class="eyebrow">'+(p.sambutan?'Sambutan Kepala Desa':'Selamat Datang')+'</div><p class="quote">'+esc(quote)+'</p>'+sig+'</section>'+
    '<section class="agenda"><div class="eyebrow" style="margin-bottom:6px">Agenda Terdekat</div>'+ag+'</section></div>'+
    '<div class="r"><div class="stats">'+stats.map(function(s){return '<div class="stat"><b>'+dash(p[s[0]])+'</b><span>'+s[1]+'</span></div>';}).join('')+'</div>'+svc+'</div></div>';
}

function rowsHTML(title,arr,totalLabel){
  var tp=sum(arr,'pagu'),tr=sum(arr,'realisasi');
  return '<div class="tb"><h3>'+title+'</h3><div class="brow h"><div>Uraian</div><div class="v">Pagu (Rp)</div><div class="v">Realisasi (Rp)</div><div>%</div></div>'+
    (arr.length?arr.map(function(x){var q=pct(x.realisasi,x.pagu);return '<div class="brow"><div>'+esc(x.nama)+'</div><div class="v">'+rp(x.pagu)+'</div><div class="v">'+rp(x.realisasi)+'</div><div class="p">'+q+'%<div class="bar"><i style="width:'+Math.min(100,q)+'%"></i></div></div></div>';}).join(''):'<div class="brow"><div style="color:var(--muted)">Belum ada data</div></div>')+
    '<div class="brow t"><div>'+totalLabel+'</div><div class="v">'+rp(tp)+'</div><div class="v">'+rp(tr)+'</div><div class="p">'+pct(tr,tp)+'%</div></div></div>';
}
function sAnggaran(){
  var a=data.anggaran,pd=sum(a.pendapatan,'pagu'),pr=sum(a.pendapatan,'realisasi'),bp=sum(a.belanja,'pagu'),br=sum(a.belanja,'realisasi');

  return head('Pagu Anggaran Desa','APBDes Tahun Anggaran '+esc(a.tahun)+(a.perTanggal?' · realisasi per '+fd(a.perTanggal):''))+
  '<div class="tiles">'+
   '<div class="tile"><div class="lb">Pendapatan</div><div class="vl">'+compact(pd)+'</div><div class="sb">Realisasi '+pct(pr,pd)+'%</div><div class="bar"><i style="width:'+Math.min(100,pct(pr,pd))+'%"></i></div></div>'+
   '<div class="tile"><div class="lb">Belanja</div><div class="vl">'+compact(bp)+'</div><div class="sb">Realisasi '+pct(br,bp)+'%</div><div class="bar"><i style="width:'+Math.min(100,pct(br,bp))+'%"></i></div></div>'+
   '<div class="tile"><div class="lb">'+(sd>=0?'Surplus':'Defisit')+'</div><div class="vl">'+compact(Math.abs(sd))+'</div><div class="sb">Pendapatan dikurangi belanja</div></div>'+
   '<div class="tile"><div class="lb">Pembiayaan Netto</div><div class="vl">'+compact(pn-pg)+'</div><div class="sb">Terima '+compact(pn)+' · Keluar '+compact(pg)+'</div></div>'+
  '</div><div class="tables">'+rowsHTML('Pendapatan Desa',a.pendapatan,'Jumlah Pendapatan')+rowsHTML('Belanja Desa',a.belanja,'Jumlah Belanja')+'</div>';
}

   '<div class="pgrid">'+l.map(function(x,i){
     return '<div class="pcard'+(i===0?' first':'')+'">'+avHTML(x)+'<div><div class="nm">'+esc(x.nama)+'</div><div class="jb">'+esc(x.jabatan)+'</div></div></div>';
   }).join('')+'</div>';
}

function donut(counts,total){
  if(!total)return 'var(--panel-2)';
  var acc=0,segs=[];
  STATUS.forEach(function(s){
    var c=counts[s]||0;if(!c)return;
    segs.push('var(--'+SC[s]+') '+(acc/total*360)+'deg '+((acc+c)/total*360)+'deg');acc+=c;
  });
  return 'conic-gradient('+segs.join(',')+')';
}
function sHadirAuto(){
  var l=data.perangkat||[],hk=num(data.hadir.hariKerja),jm=data.hadir.jamMasuk||'07:30',counts={};
  l.forEach(function(x){counts[x.status]=(counts[x.status]||0)+1;});
  var present=(counts['Hadir']||0)+(counts['Dinas Luar']||0),total=l.length;
  var tgl=data.hadir.tanggal||todayISO();
  var stale=data.hadir.tanggal&&data.hadir.tanggal!==todayISO();
  var rows=l.map(function(x){
    var c=SC[x.status]||'idle',q=hk>0?Math.min(100,Math.round(num(x.hadir)/hk*100)):0;
    var late=x.status==='Hadir'&&x.masuk&&x.masuk>jm;
    return '<div class="ar"><div style="min-width:0"><div class="n">'+esc(x.nama)+'</div><div class="j">'+esc(x.jabatan)+'</div></div>'+
      '<div><span class="pill c-'+c+'">'+esc(x.status)+'</span>'+(late?'<span class="late">Terlambat</span>':'')+'</div><div class="tm">'+(esc(x.masuk)||'–')+'</div><div class="tm">'+(esc(x.pulang)||'–')+'</div>'+
      '<div class="rk">'+num(x.hadir)+' / '+hk+' hari<div class="bar"><i style="width:'+q+'%"></i></div></div></div>';
  }).join('')||'<div class="empty">Belum ada data perangkat desa.</div>';
  return head('Daftar Hadir Perangkat','<span class="num">'+fd(tgl,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span>')+
   '<div class="att"><div class="atbl"><div class="ar h"><div>Nama dan jabatan</div><div>Status</div><div>Masuk</div><div>Pulang</div><div>Rekap bulan ini</div></div><div class="rows">'+rows+'</div></div>'+
   '<aside class="side"><div class="donut" style="background:'+donut(counts,total)+'"><div class="hole"><div><b class="num">'+(total?Math.round(present/total*100):0)+'%</b><span>Hadir</span></div></div></div>'+
   '<div class="leg">'+STATUS.map(function(s){return '<div><span class="pill c-'+SC[s]+'">'+s+'</span><b>'+(counts[s]||0)+'</b></div>';}).join('')+'</div>'+
   (stale?'<div class="stale">Data kehadiran tanggal '+fd(data.hadir.tanggal)+'. Perbarui lewat Edit, tab Daftar Hadir.</div>':'')+'</aside></div>';
}
function sHadir(){
  var h=String(data.hadir.html||'').trim();
  return h?h:sHadirAuto();
}

function sGaleri(){

function sha256(str){
  var K=[],H=[],p=0,c,i,j;
  function isP(n){for(var d=2;d*d<=n;d++)if(n%d===0)return false;return true;}
  function fr(x){return ((x-Math.floor(x))*4294967296)|0;}
  for(c=2;p<64;c++){if(isP(c)){if(p<8)H[p]=fr(Math.pow(c,1/2));K[p++]=fr(Math.pow(c,1/3));}}
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var m=unescape(encodeURIComponent(str)),len=m.length,W=[];
  for(i=0;i<len;i++)W[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
  W[len>>2]|=0x80<<(24-(len%4)*8);
  W[(((len+8)>>6)+1)*16-1]=len*8;
  var w=[],h=H.slice(0);
  for(j=0;j<W.length;j+=16){
    var a=h.slice(0);
    for(i=0;i<64;i++){
      if(i<16)w[i]=W[j+i]|0;
      else{var g=w[i-15],t=w[i-2];w[i]=(w[i-16]+(rr(g,7)^rr(g,18)^(g>>>3))+w[i-7]+(rr(t,17)^rr(t,19)^(t>>>10)))|0;}
      var e=a[4],aa=a[0];
      var t1=(a[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&a[5])^(~e&a[6]))+K[i]+w[i])|0;
      var t2=((rr(aa,2)^rr(aa,13)^rr(aa,22))+((aa&a[1])^(aa&a[2])^(a[1]&a[2])))|0;
      a=[(t1+t2)|0,a[0],a[1],a[2],(a[3]+t1)|0,a[4],a[5],a[6]];
    }
    for(i=0;i<8;i++)h[i]=(h[i]+a[i])|0;
  }
  return h.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8);}).join('');
}

  }else{
    fails++;$('lgPass').value='';
    if(fails>=3){lockUntil=Date.now()+30000;fails=0;$('lgErr').textContent='Nama pengguna atau kata sandi salah. Terkunci 30 detik.';}
    else $('lgErr').textContent='Nama pengguna atau kata sandi salah.';
    $('lgPass').focus();
  }
});
function closeEd(){$('ed').hidden=true;buildShell();renderAll();show(idx);setPaused(false);}
function dirty(){save();clearTimeout(rt);rt=setTimeout(renderAll,200);}
function structural(){save();renderAll();buildEd(true);}

function logoFrom(file){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var m=256,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      data.tampil.logo=c.toDataURL('image/png');dirty();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function photoFrom(file,path,mode){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),x=c.getContext('2d');
      if(mode==='sq'){
        var s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)*0.2;
        c.width=c.height=400;x.drawImage(img,sx,sy,s,s,0,0,400,400);
      }else{
        var k=Math.min(1,1100/Math.max(img.width,img.height));
        c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
        x.drawImage(img,0,0,c.width,c.height);
      }
      setAt(path,c.toDataURL('image/jpeg',mode==='sq'?0.85:0.75));structural();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function status(msg){var s=$('stt');if(s)s.textContent=msg;}

$('ed').addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.path)return;
  var v=t.type==='checkbox'?t.checked:(t.type==='number'?(t.value===''?0:Number(t.value)):t.value);
  setAt(t.dataset.path,v);dirty();
});
$('ed').addEventListener('change',function(e){
  if(e.target.id==='logoFile'&&e.target.files&&e.target.files[0])logoFrom(e.target.files[0]);
  else if(e.target.dataset&&e.target.dataset.photo&&e.target.files&&e.target.files[0])photoFrom(e.target.files[0],e.target.dataset.photo,e.target.dataset.mode);
});
$('ed').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){curTab=b.dataset.tab;buildEd(false);return;}
  var a=b.dataset.act;if(!a)return;
  var path=b.dataset.list,i=Number(b.dataset.i),arr=path?getAt(path):null;
  if(a==='close'){closeEd();}
  else if(a==='add'){arr.push(LISTS[path].blank());structural();setTimeout(function(){var bd=$('ed').querySelector('.ed-body');bd.scrollTop=bd.scrollHeight;},0);}
  else if(a==='up'&&i>0){var x=arr[i];arr[i]=arr[i-1];arr[i-1]=x;structural();}
  else if(a==='down'&&i<arr.length-1){var y=arr[i];arr[i]=arr[i+1];arr[i+1]=y;structural();}
  else if(a==='del'){
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Yakin hapus?';setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent='Hapus';}},3000);}
    else{arr.splice(i,1);structural();}
  }
  else if(a==='st'){
    var pp=arr[i],stt=b.dataset.s,nw=new Date(),hm=(nw.getHours()<10?'0':'')+nw.getHours()+':'+(nw.getMinutes()<10?'0':'')+nw.getMinutes();
    pp.status=stt;
    if(stt==='Hadir'&&!pp.masuk)pp.masuk=hm;
    if(stt!=='Hadir'&&stt!=='Dinas Luar'){pp.masuk='';pp.pulang='';}
    if(!data.hadir.tanggal)data.hadir.tanggal=todayISO();
    structural();
  }
  else if(a==='htmlisi'){data.hadir.html=sHadirAuto();structural();}
  else if(a==='htmlkosong'){data.hadir.html='';structural();}
  else if(a==='hariini'){data.hadir.tanggal=todayISO();data.perangkat.forEach(function(p){p.status='Belum Hadir';p.masuk='';p.pulang='';});structural();}
  else if(a==='semuahadir'){data.perangkat.forEach(function(p){p.status='Hadir';});structural();}
  else if(a==='nophoto'){setAt(b.dataset.path,'');structural();}
  else if(a==='nologo'){data.tampil.logo='';structural();}
  else if(a==='salin'){
    var ta=$('jsonbox');
    var done=function(){status('Tersalin.');};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();status('Teks dipilih, tekan Ctrl+C untuk menyalin.');});}
    else{ta.select();status('Teks dipilih, tekan Ctrl+C untuk menyalin.');}
  }
  else if(a==='terapkan'){
    try{data=merge(clone(DEFAULT),JSON.parse($('jsonbox').value));save();renderAll();status('Data diterapkan.');}
    catch(err){status('Format data tidak valid, tidak ada yang diubah.');}
  }
  else if(a==='reset'){
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Klik lagi untuk reset';setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent='Reset';}},4000);}
    else{data=clone(DEFAULT);save();renderAll();buildEd(false);}
  }
});

/* ===== Papan Ketik dan Kursor ===== */
document.addEventListener('keydown',function(e){
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');
  if(e.key==='Escape'&&!$('lg').hidden){closeLogin();return;}
  if(e.key==='Escape'&&!$('ed').hidden){closeEd();return;}
  if(!$('lg').hidden)return;
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!$('ed').hidden)return;
  if(e.key==='ArrowRight'){show(idx+1);}
  else if(e.key==='ArrowLeft'){show(idx-1);}
  else if(e.key===' '){e.preventDefault();setPaused(!paused);}
  else if(e.key==='e'||e.key==='E'){e.preventDefault();openLogin();}
  else if(e.key==='f'||e.key==='F'){
    try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){});}catch(x){}
  }
});
$('editBtn').addEventListener('click',openLogin);
var idleT=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},3000);}
document.addEventListener('mousemove',wake);document.addEventListener('keydown',wake);

/* ===== Menjalankan Halaman ===== */
buildShell();renderAll();tick();fit();show(0);wake();
setInterval(tick,1000);
window.addEventListener('resize',fit);
initDb();
})();
</script>
