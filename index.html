<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daftar Hadir Desa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Library Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#06131a; --panel:#0c1f29; --panel2:#102a36; --line:rgba(190,225,215,.12);
  --fg:#eaf3f0; --muted:#8fa8a6; --gold:#e6b655; --gold2:#f6d98f;
  --hadir:#38e08f; --izin:#58c4ff; --sakit:#b99cff; --dinas:#ffa94d; --belum:#98a9b4; --alpa:#ff5d6c;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;font-size:clamp(13px,calc(.55vw + .6vh),30px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.idle{cursor:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 38s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#0e6a5a;left:-18vmax;top:-22vmax}
.bg i:nth-child(2){background:#143a6e;right:-24vmax;bottom:-28vmax;animation-duration:46s;opacity:.45}
.bg i:nth-child(3){background:#6b4a14;left:38vw;top:30vh;width:34vmax;height:34vmax;opacity:.16;animation-duration:52s}
.bg::after{content:"";position:absolute;inset:0;opacity:.7;
  background:
   radial-gradient(circle at 0 0,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px,
   radial-gradient(circle at 100% 0,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px,
   radial-gradient(circle at 0 100%,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px,
   radial-gradient(circle at 100% 100%,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,transparent 25%,#000 100%);mask-image:radial-gradient(ellipse at 50% 40%,transparent 25%,#000 100%)}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

.stage{position:relative;z-index:1;height:100%;display:grid;gap:1.1rem;
  grid-template-columns:clamp(15rem,19vw,26rem) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "side grid" "tick tick";padding-block:1.1rem}

.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem;
  padding:.9rem 1.4rem;border-radius:1.1rem;border:1px solid var(--line);
  background:linear-gradient(100deg,rgba(16,42,54,.85),rgba(10,28,38,.7));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:1.1rem;min-width:0}
.seal{width:4.6rem;height:4.6rem;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(230,182,85,.18),transparent 70%);box-shadow:0 0 0 1px rgba(230,182,85,.35),0 0 2rem rgba(230,182,85,.18)}
.seal img,.seal svg{width:88%;height:88%;object-fit:contain}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{margin:.15rem 0 0;font-family:var(--display);font-weight:700;font-size:2.35rem;line-height:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{text-align:center}
.ttl span{display:block;font-size:.8rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold2);font-weight:600;padding-left:.42em}
.ttl b{display:block;font-family:var(--display);font-weight:800;font-size:2.7rem;line-height:1.05;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff,#b9d6cf);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{text-align:right}
.time{font-family:var(--mono);font-weight:700;font-size:3.1rem;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.time i{font-style:normal;color:var(--gold);animation:blink 1s steps(2) infinite}
.time small{font-size:1.2rem;color:var(--muted);margin-left:.35rem;letter-spacing:0}
.date{margin-top:.3rem;font-size:1.05rem;color:var(--muted);font-weight:500}
@keyframes blink{50%{opacity:.15}}

.side{grid-area:side;min-height:0;display:flex;flex-direction:column;gap:1rem;padding:1.2rem;border-radius:1.1rem;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(16,42,54,.8),rgba(8,24,32,.7));backdrop-filter:blur(8px)}
.side h2{margin:0;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ring{position:relative;width:min(100%,15rem);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .tr{stroke:rgba(255,255,255,.07)}
.ring .pg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 .5rem rgba(56,224,143,.55))}
.ring .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ct b{font-family:var(--display);font-weight:800;font-size:3.3rem;line-height:1;letter-spacing:-.03em}
.ring .ct b sup{font-size:1.3rem;font-weight:600;color:var(--muted);vertical-align:top;margin-left:.1rem}
.ring .ct span{font-size:.9rem;color:var(--muted);margin-top:.3rem}
.stats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem;flex:1;min-height:0}
.stats li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:.7rem;
  background:rgba(255,255,255,.03);border:1px solid transparent}
.stats .d{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);box-shadow:0 0 .7rem var(--c)}
.stats .l{font-size:1rem;font-weight:500}
.stats .n{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--c);line-height:1}
.stats li small{grid-column:2/4;color:var(--muted);font-size:.78rem;margin-top:-.45rem}
.rules{font-size:.82rem;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:.8rem}
.rules b{color:var(--fg);font-weight:600;font-family:var(--mono)}

.grid{grid-area:grid;min-height:0;min-width:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--gap,1rem)}
.card{container-type:size;width:var(--cw,260px);height:var(--ch,240px);position:relative;border-radius:1.1rem;overflow:hidden;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);
  background:radial-gradient(130% 80% at 50% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 62%),var(--panel);
  transition:transform .25s,border-color .4s,background .4s,box-shadow .4s}
.card:hover{transform:translateY(-3px)}
.card[data-s=hadir]{--c:var(--hadir);box-shadow:0 0 2.2rem -.8rem var(--hadir)}
.card[data-s=izin]{--c:var(--izin)}
.card[data-s=sakit]{--c:var(--sakit)}
.card[data-s=dinas]{--c:var(--dinas)}
.card[data-s=belum]{--c:var(--belum);border-style:dashed}
.card[data-s=alpa]{--c:var(--alpa);box-shadow:0 0 2rem -1rem var(--alpa)}
.card[data-s=alpa]::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,93,108,.05) 14px 28px)}
.in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqmin;padding:4cqmin 5cqmin;text-align:center;position:relative;z-index:1}
.no{position:absolute;left:4.5cqmin;top:4cqmin;font-family:var(--mono);font-weight:700;font-size:max(11px,4.6cqmin);color:var(--muted);opacity:.8}
.av{position:relative;width:37cqmin;height:37cqmin;flex:none;border-radius:50%;padding:1.1cqmin;
  background:conic-gradient(from 0deg,var(--c),color-mix(in srgb,var(--c) 25%,transparent),var(--c));transition:filter .5s}
.card[data-s=hadir] .av{animation:glow 3.2s ease-in-out infinite}
.card[data-s=belum] .av{animation:wait 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1.4cqmin color-mix(in srgb,var(--hadir) 18%,transparent),0 0 7cqmin color-mix(in srgb,var(--hadir) 55%,transparent)}}
@keyframes wait{50%{opacity:.55}}
.av .pic{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--panel2);
  font-family:var(--display);font-weight:700;font-size:13cqmin;color:#fff;transition:filter .5s}
.av .pic img{width:100%;height:100%;object-fit:cover}
.card[data-s=alpa] .pic,.card[data-s=belum] .pic{filter:grayscale(.85) brightness(.7)}
.card[data-s=izin] .pic,.card[data-s=sakit] .pic,.card[data-s=dinas] .pic{filter:grayscale(.45) brightness(.82)}
.bd{position:absolute;right:-1cqmin;bottom:-1cqmin;width:12.5cqmin;height:12.5cqmin;border-radius:50%;display:grid;place-items:center;
  background:var(--c);color:#04120d;border:.9cqmin solid var(--panel)}
.bd svg{width:62%;height:62%}
.nm{margin:0;font-family:var(--display);font-weight:650;font-size:max(14px,9.6cqmin);line-height:1.08;letter-spacing:-.01em;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jb{margin:0;font-size:max(11px,5.9cqmin);color:var(--muted);font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:1.6cqmin;padding:1.3cqmin 4cqmin;border-radius:99px;font-weight:700;letter-spacing:.1em;
  font-size:max(11px,5.8cqmin);color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.pill::before{content:"";width:1.8cqmin;height:1.8cqmin;border-radius:50%;background:var(--c);box-shadow:0 0 1.5cqmin var(--c)}
.tm{font-family:var(--mono);font-size:max(10px,5cqmin);color:var(--muted);min-height:1.2em;display:flex;gap:2cqmin;align-items:center;justify-content:center;flex-wrap:wrap}
.late{color:#1a1203;background:var(--gold);border-radius:99px;padding:.2cqmin 2.2cqmin;font-weight:700;font-family:var(--body);font-size:.9em}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{transform:scale(1.06);box-shadow:0 0 0 0 var(--hadir),0 0 5rem var(--hadir)}100%{transform:scale(1)}}

.tick{grid-area:tick;display:flex;align-items:stretch;border-radius:.9rem;overflow:hidden;border:1px solid var(--line);
  background:rgba(8,24,32,.8);backdrop-filter:blur(8px);height:3.1rem;position:relative}
.tick .lb{flex:none;display:flex;align-items:center;padding:0 1.3rem;background:linear-gradient(100deg,var(--gold),#c88f2e);color:#231703;
  font-weight:800;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase}
.tick .mq{flex:1;overflow:hidden;display:flex;align-items:center;min-width:0;padding-right:9rem}
.tick .tr{display:flex;flex:none;white-space:nowrap;animation:mq var(--mqd,60s) linear infinite}
.tick .tr span{padding:0 2.2rem;font-size:1.05rem;font-weight:500;position:relative}
.tick .tr span::after{content:"◆";position:absolute;right:-.45rem;color:var(--gold);font-size:.6rem;top:50%;transform:translateY(-50%)}
.tick .tr em{font-style:normal;color:var(--hadir);font-weight:700}
@keyframes mq{to{transform:translateX(-50%)}}

.tools{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(1.1rem + env(safe-area-inset-bottom,0px) + .3rem);z-index:20;display:flex;gap:.4rem;transition:opacity .4s}
body.idle .tools{opacity:0;pointer-events:none}
.tools button{width:2.4rem;height:2.4rem;border-radius:.7rem;border:1px solid var(--line);background:rgba(16,42,54,.92);cursor:pointer;display:grid;place-items:center;color:var(--fg)}
.tools button:hover{border-color:var(--gold);color:var(--gold)}
.tools svg{width:1.15rem;height:1.15rem}
.demo{position:fixed;left:50%;top:.35rem;transform:translateX(-50%);z-index:15;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:.25rem .8rem;border-radius:99px;background:var(--gold);color:#241803;animation:wait 2.4s infinite}
.toast{position:fixed;left:50%;top:8.2rem;z-index:30;transform:translate(-50%,-2rem) scale(.96);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:1.2rem;padding:1rem 2rem 1rem 1rem;border-radius:1.4rem;
  background:linear-gradient(100deg,#0d3d2f,#0b2a33);border:1px solid var(--hadir);box-shadow:0 0 5rem -1rem var(--hadir),0 1.5rem 3rem rgba(0,0,0,.5);
  transition:transform .5s cubic-bezier(.2,1.2,.3,1),opacity .4s;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
.toast .tick-c{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--hadir);color:#03130c;display:grid;place-items:center;flex:none}
.toast .tick-c svg{width:2rem;height:2rem}
.toast small{display:block;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hadir);font-weight:700}
.toast b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1;font-weight:700}
.toast span{color:var(--muted);font-size:1rem}
.buf{position:fixed;left:50%;bottom:5.4rem;transform:translateX(-50%);z-index:30;padding:.6rem 1.4rem;border-radius:.9rem;background:var(--panel2);
  border:1px solid var(--gold);font-family:var(--mono);font-size:1.3rem}
.buf small{color:var(--muted);font-size:.8rem;margin-left:.6rem;font-family:var(--body)}

.ov{position:fixed;inset:0;z-index:50;background:rgba(2,9,13,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.dlg{width:min(34rem,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:1.2rem;background:var(--panel);border:1px solid var(--line);padding:1.4rem;box-shadow:0 2rem 5rem rgba(0,0,0,.6)}
.dlg.wide{width:min(54rem,100%)}
.dlg h3{margin:0 0 .2rem;font-family:var(--display);font-size:1.6rem}
.dlg p.sub{margin:0 0 1rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.opts button{display:flex;align-items:center;gap:.7rem;padding:.85rem 1rem;border-radius:.8rem;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 12%,transparent);cursor:pointer;font-weight:600;text-align:left}
.opts button:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.opts button::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.btn{padding:.65rem 1.1rem;border-radius:.7rem;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#241803;border-color:var(--gold)}
.btn.dng{color:var(--alpa);border-color:color-mix(in srgb,var(--alpa) 50%,transparent)}
.foot{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-bottom:.7rem}
.f2 label,.f1 label{display:flex;flex-direction:column;gap:.3rem;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.f1{margin-bottom:.7rem}
.inp{padding:.6rem .75rem;border-radius:.6rem;border:1px solid var(--line);background:#071820;color:var(--fg);width:100%;min-width:0}
.inp:focus{border-color:var(--gold);outline:none}
.sec{margin:1.1rem 0 .5rem;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.orow{display:grid;grid-template-columns:auto 2.2rem minmax(0,1fr) minmax(0,1fr) auto;gap:.5rem;align-items:center;margin-bottom:.45rem}
.orow .ph{width:2.6rem;height:2.6rem;border-radius:50%;overflow:hidden;background:var(--panel2);border:1px dashed var(--muted);display:grid;place-items:center;cursor:pointer;font-size:.75rem;color:var(--muted);position:relative}
.orow .ph img{width:100%;height:100%;object-fit:cover}
.orow .ph input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.orow .num{font-family:var(--mono);color:var(--muted);text-align:center}
.orow .acts{display:flex;gap:.25rem}
.orow .acts button{width:2rem;height:2rem;border-radius:.5rem;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.help{font-size:.82rem;color:var(--muted);line-height:1.6;margin-top:1rem;padding:.8rem 1rem;border-radius:.7rem;background:rgba(255,255,255,.03)}
.help kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);padding:.05rem .4rem;border-radius:.3rem;color:var(--fg)}
.logo-row{display:flex;align-items:center;gap:.8rem}

@media (max-width:1000px){
  html,body{height:auto}
  .stage{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "side" "grid" "tick"}
  .top{grid-template-columns:1fr;text-align:center}
  .brand{justify-content:center}.clock{text-align:center}
  .side{flex-direction:column}
  .orow{grid-template-columns:auto minmax(0,1fr) auto}.orow .num{display:none}.orow .in-jab{grid-column:2}
  .f2,.opts{grid-template-columns:1fr}
  .tick .mq{padding-right:3rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bg"><i></i><i></i><i></i></div>

<div class="stage" id="stage">
  <header class="top">
    <div class="brand">
      <div class="seal" id="seal"></div>
      <div style="min-width:0"><div class="eyebrow" id="kab"></div><h1 id="desa"></h1></div>
    </div>
    <div class="ttl"><span>Daftar Hadir</span><b>Perangkat Desa</b></div>
    <div class="clock">
      <div class="time"><span id="hh">--</span><i>:</i><span id="mm">--</span><small id="ss">--</small></div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <aside class="side">
    <h2>Kehadiran hari ini</h2>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e08f"/><stop offset="1" stop-color="#7cf3c6"/></linearGradient></defs>
        <circle class="tr" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
        <circle class="pg" id="pg" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
      </svg>
      <div class="ct"><b><span id="pct">0</span><sup>%</sup></b><span id="frac">0 dari 0 hadir</span></div>
    </div>
    <ul class="stats" id="stats"></ul>
    <div class="rules" id="rules"></div>
  </aside>

  <main class="grid" id="grid" aria-label="Daftar perangkat desa"></main>

  <footer class="tick">
    <div class="lb">Info Desa</div>
    <div class="mq"><div class="tr" id="tr"></div></div>
  </footer>
</div>

<div class="demo" id="demo" hidden>Data contoh · buka Pengaturan untuk mengisi data desa</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="buf" id="buf" hidden></div>

<div class="tools">
  <button id="bFull" title="Layar penuh (F)" aria-label="Layar penuh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bSet" title="Pengaturan (S)" aria-label="Pengaturan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<div class="ov" id="ovPick" hidden></div>
<div class="ov" id="ovSet" hidden></div>

<script>
(function(){
"use strict";

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
var hhmm=function(d){return pad(d.getHours())+":"+pad(d.getMinutes())};
var dayKey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var toMin=function(s){var p=String(s||"0:0").split(":");return (+p[0]||0)*60+(+p[1]||0)};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var ST={
  hadir:{lb:"HADIR",nt:"Hadir di kantor",ic:'<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>'},
  izin:{lb:"IZIN",nt:"Berhalangan hadir",ic:'<path d="M7 4h8l3 3v13H7zM10 12h5M10 16h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'},
  sakit:{lb:"SAKIT",nt:"Sedang sakit",ic:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>'},
  dinas:{lb:"DINAS LUAR",nt:"Bertugas di luar kantor",ic:'<path d="M4 9h16v10H4zM9 9V6h6v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>'},
  belum:{lb:"BELUM HADIR",nt:"Belum check-in",ic:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>'},
  alpa:{lb:"TIDAK HADIR",nt:"Tanpa keterangan",ic:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>'}
};
var ORDER=["hadir","izin","sakit","dinas","belum","alpa"];
var STAT_LABEL={hadir:"Hadir",izin:"Izin",sakit:"Sakit",dinas:"Dinas Luar",belum:"Belum Hadir",alpa:"Tidak Hadir"};

var SEAL='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#e6b655" stroke-width="3"/><circle cx="50" cy="50" r="39" fill="none" stroke="#e6b655" stroke-width="1" opacity=".6"/><circle cx="50" cy="31" r="7" fill="#f6d98f"/><path d="M17 64L38 39l12 13 14-19 19 31z" fill="#e6b655"/><path d="M50 82V66M50 72c-6-1-9-5-9-9 6 0 9 4 9 9zM50 72c6-1 9-5 9-9-6 0-9 4-9 9zM50 78c-5-1-8-4-8-8 5 0 8 3 8 8zM50 78c5-1 8-4 8-8-5 0-8 3-8 8z" fill="#f6d98f" stroke="#f6d98f" stroke-width="1"/></svg>';

var DEFAULT={
  desa:"Majelis Hidayah",kec:"Kuala Jambi",kab:"Tanjung Jabung Timur",jamMasuk:"08:00",batas:"09:00",logo:"",
  info:"Selamat datang di Kantor Desa Majelis Hidayah. Pelayanan administrasi dibuka Senin sampai Jumat pukul 08.00 – 15.00 WIB.",
  officials:[
    ["Hendra Wijaya, S.Sos","Kepala Desa"],["Siti Aminah, S.E.","Sekretaris Desa"],["Agus Prasetyo","Kaur Tata Usaha & Umum"],
    ["Ratna Dewi","Kaur Keuangan"],["Bambang Sutrisno","Kaur Perencanaan"],["Joko Santoso","Kasi Pemerintahan"],
    ["Lestari Handayani","Kasi Kesejahteraan"],["Yusuf Maulana","Kasi Pelayanan"],["Darmawan","Kepala Dusun I"],
    ["Nur Hidayah","Kepala Dusun II"],["Eko Setiawan","Kepala Dusun III"],["Mulyani","Staf Administrasi"]
  ].map(function(a,i){return {id:"p"+(i+1),nama:a[0],jab:a[1],foto:""}})
};

/* ---------- state ---------- */
var cfg=lsGet("hd.cfg")||null, cfgSaved=!!cfg; if(!cfg) cfg=JSON.parse(JSON.stringify(DEFAULT));
var key=dayKey(new Date());
var recs=lsGet("hd.r."+key)||{};
var demo=false;
var loaded=false;
var db=null;

/* ---------- Firebase Safe Init ---------- */
function initDb(){
  try {
    if (typeof firebase !== "undefined") {
      const firebaseConfig = {
        apiKey: "AIzaSyBINhL5aMzRuYZBlj35XjUuKdEOfjtWNB8",
        authDomain: "absen-desa.firebaseapp.com",
        databaseURL: "https://absen-desa-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "absen-desa",
        storageBucket: "absen-desa.firebasestorage.app",
        messagingSenderId: "924833863159",
        appId: "1:924833863159:web:8eefe3ff06357ea39e0af2"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();

      // Sinkronisasi konfigurasi desa
      db.ref("desa/config").on("value", function(snapshot){
        var val = snapshot.val();
        if(val){
          cfg = val;
          cfgSaved = true;
          lsSet("hd.cfg", cfg);
          renderAll();
        }
      });

      // Sinkronisasi rekaman absen
      subscribeDay();
    }
  } catch(err) {
    console.warn("Firebase offline/terblokir, beralih ke penyimpanan lokal:", err);
    db = null;
  }
}

function saveCfg(){
  lsSet("hd.cfg",cfg);
  if(db) { try { db.ref("desa/config").set(cfg); } catch(e){} }
}
function saveRecs(){
  lsSet("hd.r."+key,recs);
  if(db) { try { db.ref("hadir/"+key).set({r:recs}); } catch(e){} }
}

function subscribeDay(){
  if(!db) return;
  try {
    db.ref("hadir/"+key).on("value", function(snapshot){
      var val = snapshot.val();
      if(val && val.r){
        applyRecs(val.r);
      }
    });
  } catch(e){}
}

/* ---------- derived ---------- */
function curRecs(){ return recs; }
function statusOf(o,now){
  var r=curRecs()[o.id];
  if(r&&r.s&&r.s!=="belum") return r.s;
  return toMin(hhmm(now))>=toMin(cfg.batas)?"alpa":"belum";
}
function initials(n){
  var w=String(n).replace(/,.*$/,"").split(/\s+/).filter(function(x){return x&&!/^(h\.|hj\.|drs\.|dr\.|ir\.|bpk|ibu|pak)$/i.test(x)});
  return ((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase();
}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}

/* ---------- header ---------- */
var HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function renderHead(){
  $("#desa").textContent="Desa "+cfg.desa;
  $("#kab").textContent=[cfg.kab&&cfg.kab.toUpperCase(),cfg.kec&&cfg.kec.toUpperCase()].filter(Boolean).join(" · ");
  $("#seal").innerHTML=cfg.logo?'<img alt="Logo desa" src="'+esc(cfg.logo)+'">':SEAL;
  document.title="Daftar Hadir Desa "+cfg.desa;
}
function tickClock(){
  var d=new Date();
  $("#hh").textContent=pad(d.getHours()); $("#mm").textContent=pad(d.getMinutes()); $("#ss").textContent=pad(d.getSeconds());
  $("#date").textContent=HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear()+" · WIB";
  var k=dayKey(d);
  if(k!==key){ key=k; recs=lsGet("hd.r."+key)||{}; subscribeDay(); renderAll(); }
  else if(d.getSeconds()===0) updateAll();
}

/* ---------- grid ---------- */
var gridSig="";
function buildGrid(){
  var g=$("#grid"), os=cfg.officials;
  var sig=JSON.stringify(os);
  if(sig===gridSig && g.children.length===os.length){ fitGrid(); return; }
  gridSig=sig;
  g.innerHTML=os.map(function(o,i){
    var pic=o.foto?'<img alt="" src="'+esc(o.foto)+'">':esc(initials(o.nama));
    var bg=o.foto?"":' style="background:linear-gradient(150deg,hsl('+hue(o.nama)+' 45% 34%),hsl('+((hue(o.nama)+40)%360)+' 45% 20%))"';
    return '<article class="card" role="button" tabindex="0" data-id="'+esc(o.id)+'" data-s="belum" aria-label="'+esc(o.nama)+'">'+
      '<div class="in"><span class="no">'+(i+1)+'</span>'+
      '<div class="av"><div class="pic"'+bg+'>'+pic+'</div><div class="bd"></div></div>'+
      '<h3 class="nm">'+esc(o.nama)+'</h3><p class="jb">'+esc(o.jab)+'</p>'+
      '<span class="pill"></span><div class="tm"></div></div></article>';
  }).join("");
  fitGrid(); updateAll();
}
function fitGrid(){
  var g=$("#grid"), n=cfg.officials.length||1, gap=parseFloat(getComputedStyle(document.documentElement).fontSize);
  g.style.setProperty("--gap",gap+"px");
  var W=g.clientWidth, H=g.clientHeight, best=null;
  if(window.innerWidth<=1000){
    var c=W<560?2:3, w=(W-(c-1)*gap)/c;
    g.style.setProperty("--cw",w+"px"); g.style.setProperty("--ch",Math.max(220,w*1.1)+"px"); return;
  }
  for(var c2=1;c2<=n;c2++){
    var rows=Math.ceil(n/c2), w2=(W-(c2-1)*gap)/c2, h2=(H-(rows-1)*gap)/rows;
    var empty=rows*c2-n, score=Math.min(w2/1.12,h2)*(1-.02*empty);
    if(!best||score>best.s) best={s:score,w:w2,h:h2};
  }
  g.style.setProperty("--cw",Math.floor(best.w)+"px"); g.style.setProperty("--ch",Math.floor(best.h)+"px");
}

function updateCards(now){
  var cnt={hadir:0,izin:0,sakit:0,dinas:0,belum:0,alpa:0}, late=0, R=curRecs();
  cfg.officials.forEach(function(o){
    var s=statusOf(o,now); cnt[s]++;
    var el=$('.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(o.id):o.id)+'"]'); if(!el) return;
    var r=R[o.id], isLate=s==="hadir"&&r&&r.t&&r.t>cfg.jamMasuk; if(isLate) late++;
    var sig=s+"|"+(r&&r.t||"")+"|"+(isLate?1:0);
    if(el.dataset.sig===sig) return; el.dataset.sig=sig;
    el.dataset.s=s;
    el.querySelector(".pill").textContent=ST[s].lb;
    el.querySelector(".bd").innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ST[s].ic+'</svg>';
    var tm=el.querySelector(".tm");
    if(s==="hadir") tm.innerHTML="<span>Pukul "+esc(r.t)+" WIB</span>"+(isLate?'<span class="late">Terlambat</span>':"");
    else if(s==="belum") tm.textContent="Batas absen "+cfg.batas;
    else tm.textContent=ST[s].nt;
  });
  return {cnt:cnt,late:late};
}
function updateSide(res){
  var c=res.cnt, total=cfg.officials.length||1, pct=Math.round(c.hadir/total*100);
  $("#pct").textContent=pct; $("#frac").textContent=c.hadir+" dari "+cfg.officials.length+" hadir";
  $("#pg").style.strokeDashoffset=(326.7*(1-c.hadir/total)).toFixed(1);
  var colors={hadir:"--hadir",izin:"--izin",sakit:"--sakit",dinas:"--dinas",belum:"--belum",alpa:"--alpa"};
  $("#stats").innerHTML=ORDER.map(function(k){
    return '<li style="--c:var('+colors[k]+')"><span class="d"></span><span class="l">'+STAT_LABEL[k]+'</span><span class="n">'+c[k]+'</span>'+
      (k==="hadir"&&res.late?'<small>'+res.late+' terlambat</small>':"")+'</li>';
  }).join("");
  $("#rules").innerHTML='Jam masuk <b>'+esc(cfg.jamMasuk)+'</b> · batas absen <b>'+esc(cfg.batas)+'</b>. Perangkat yang belum check-in setelah batas dicatat tidak hadir.';
}
function updateTicker(){
  var R=curRecs(), evs=cfg.officials.map(function(o){var r=R[o.id];return r&&r.s==="hadir"?{o:o,t:r.t}:null}).filter(Boolean)
    .sort(function(a,b){return a.t<b.t?1:-1}).slice(0,6)
    .map(function(e){return "<em>"+esc(e.o.nama)+"</em> hadir pukul "+esc(e.t)});
  var items=[cfg.info].concat(evs).filter(Boolean).map(function(t){return "<span>"+(t===cfg.info?esc(t):t)+"</span>"}).join("");
  var tr=$("#tr"), sig=items; if(tr.dataset.sig===sig) return; tr.dataset.sig=sig;
  tr.innerHTML=items+items;
  var len=tr.textContent.length/2; tr.style.setProperty("--mqd",Math.max(30,len*.2)+"s");
}
function updateAll(){ var res=updateCards(new Date()); if(res){updateSide(res);} updateTicker(); }
function renderAll(){ renderHead(); buildGrid(); updateAll(); }

/* ---------- records ---------- */
function applyRecs(nr){
  var old=recs; recs=nr; lsSet("hd.r."+key,recs);
  if(loaded){
    cfg.officials.forEach(function(o){
      var a=old[o.id], b=nr[o.id];
      if(b&&b.s==="hadir"&&!(a&&a.s==="hadir")) welcome(o);
    });
  }
  loaded=true; updateAll();
}
function setStatus(id,s){
  loaded=true;
  var nr=Object.assign({},recs);
  if(s==="belum") delete nr[id]; else nr[id]={s:s,t:hhmm(new Date())};
  applyRecs(nr); saveRecs();
}
function checkin(idx){
  var o=cfg.officials[idx]; if(!o) return;
  var cur=curRecs()[o.id]; if(cur&&cur.s==="hadir"){ flash(o.id); return; }
  setStatus(o.id,"hadir");
}
function flash(id){ var el=$('.card[data-id="'+id+'"]'); if(!el) return; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

var toastT, actx;
function chime(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    [660,880].forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*.14;
      o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.55);
    });
  }catch(e){}
}
function welcome(o){
  var t=$("#toast");
  t.innerHTML='<div class="tick-c"><svg viewBox="0 0 24 24">'+ST.hadir.ic+'</svg></div><div><small>Hadir · '+esc(hhmm(new Date()))+' WIB</small><b>'+esc(o.nama)+'</b><span>'+esc(o.jab)+' · Selamat bertugas</span></div>';
  t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on")},5200);
  flash(o.id); chime();
}

/* ---------- picker ---------- */
function openPick(id){
  var o=cfg.officials.filter(function(x){return x.id===id})[0]; if(!o) return;
  var opts=[["hadir","Hadir sekarang","--hadir"],["izin","Izin","--izin"],["sakit","Sakit","--sakit"],["dinas","Dinas luar","--dinas"],["alpa","Tidak hadir","--alpa"],["belum","Kosongkan status","--belum"]];
  var ov=$("#ovPick");
  ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h3>'+esc(o.nama)+'</h3><p class="sub">'+esc(o.jab)+'. Pilih status kehadiran hari ini.</p><div class="opts">'+
    opts.map(function(p){return '<button data-s="'+p[0]+'" style="--c:var('+p[2]+')">'+p[1]+'</button>'}).join("")+
    '</div><div class="foot"><button class="btn" data-close>Tutup</button></div></div>';
  ov.dataset.id=id; ov.hidden=false;
}
$("#ovPick").addEventListener("click",function(e){
  var b=e.target.closest("button[data-s]");
  if(b){ setStatus(this.dataset.id,b.dataset.s); this.hidden=true; return; }
  if(e.target===this||e.target.closest("[data-close]")) this.hidden=true;
});
$("#grid").addEventListener("click",function(e){var c=e.target.closest(".card"); if(c) openPick(c.dataset.id)});
$("#grid").addEventListener("keydown",function(e){ if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();openPick(e.target.dataset.id)} });

/* ---------- settings ---------- */
var draft, resetArm=false;
function photoTpl(o){return o.foto?'<img alt="" src="'+esc(o.foto)+'">':"Foto"}
function rowsHtml(){
  return draft.officials.map(function(o,i){
    return '<div class="orow" data-i="'+i+'"><label class="ph" title="Unggah foto">'+photoTpl(o)+'<input type="file" accept="image/*" data-act="foto"></label>'+
      '<span class="num">'+(i+1)+'</span><input class="inp in-nama" data-f="nama" aria-label="Nama" placeholder="Nama" value="'+esc(o.nama)+'"><input class="inp in-jab" data-f="jab" aria-label="Jabatan" placeholder="Jabatan" value="'+esc(o.jab)+'">'+
      '<div class="acts"><button data-act="up" aria-label="Naikkan">↑</button><button data-act="dn" aria-label="Turunkan">↓</button><button data-act="del" aria-label="Hapus">✕</button></div></div>';
  }).join("");
}
function openSet(){
  draft=JSON.parse(JSON.stringify(cfg)); resetArm=false;
  var ov=$("#ovSet");
  ov.innerHTML='<div class="dlg wide" role="dialog" aria-modal="true"><h3>Pengaturan</h3><p class="sub">Isi identitas desa dan daftar perangkat. Perubahan tampil di layar setelah disimpan.</p>'+
   '<div class="f2"><label>Nama desa<input id="sDesa" class="inp" value="'+esc(draft.desa)+'"></label><label>Kecamatan<input id="sKec" class="inp" value="'+esc(draft.kec)+'"></label>'+
   '<label>Kabupaten<input id="sKab" class="inp" value="'+esc(draft.kab)+'"></label>'+
   '<label>Logo desa (opsional)<div class="logo-row"><input id="sLogo" type="file" accept="image/*" class="inp"><button class="btn" id="sLogoX" type="button">Hapus</button></div></label>'+
   '<label>Jam masuk (lewat dari ini = terlambat)<input id="sJam" type="time" class="inp" value="'+esc(draft.jamMasuk)+'"></label>'+
   '<label>Batas absen (belum check-in = tidak hadir)<input id="sBatas" type="time" class="inp" value="'+esc(draft.batas)+'"></label></div>'+
   '<div class="f1"><label>Teks berjalan di bagian bawah<input id="sInfo" class="inp" value="'+esc(draft.info)+'"></label></div>'+
   '<div class="sec">Perangkat desa</div><div id="rows">'+rowsHtml()+'</div>'+
   '<div class="foot" style="justify-content:flex-start"><button class="btn" id="sAdd" type="button">+ Tambah perangkat</button></div>'+
   '<div class="help">Cara pakai: klik kartu untuk mengubah status. Ketik nomor urut lalu tekan <kbd>Enter</kbd> untuk check-in cepat. <kbd>F</kbd> layar penuh, <kbd>S</kbd> pengaturan. Hari berganti otomatis tengah malam.</div>'+
   '<div class="foot"><button class="btn dng" id="sReset" type="button">Hapus data hadir hari ini</button><button class="btn" data-close type="button">Batal</button><button class="btn pri" id="sSave" type="button">Simpan</button></div></div>';
  ov.hidden=false;
}
function resizeImg(file,size,type,q,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image(); im.onload=function(){
    var c=document.createElement("canvas"); c.width=c.height=size; var x=c.getContext("2d");
    var m=Math.min(im.width,im.height), sx=(im.width-m)/2, sy=(im.height-m)/2;
    x.drawImage(im,sx,sy,m,m,0,0,size,size); cb(c.toDataURL(type,q));
  }; im.src=fr.result}; fr.readAsDataURL(file);
}
var ovSet=$("#ovSet");
ovSet.addEventListener("input",function(e){
  var row=e.target.closest(".orow"); if(row&&e.target.dataset.f){ draft.officials[+row.dataset.i][e.target.dataset.f]=e.target.value; }
});
ovSet.addEventListener("change",function(e){
  var t=e.target, row=t.closest(".orow");
  if(t.dataset.act==="foto"&&row&&t.files[0]){ var i=+row.dataset.i; resizeImg(t.files[0],144,"image/jpeg",.72,function(u){draft.officials[i].foto=u; $("#rows").innerHTML=rowsHtml()}); }
  if(t.id==="sLogo"&&t.files[0]){ resizeImg(t.files[0],128,"image/png",.9,function(u){draft.logo=u}); }
});
ovSet.addEventListener("click",function(e){
  var t=e.target;
  if(t===ovSet||t.closest("[data-close]")){ ovSet.hidden=true; return; }
  var b=t.closest("button"); if(!b) return;
  var row=b.closest(".orow"), i=row?+row.dataset.i:-1, a=b.dataset.act, os=draft.officials;
  if(a==="up"&&i>0){var x=os[i];os[i]=os[i-1];os[i-1]=x; $("#rows").innerHTML=rowsHtml()}
  else if(a==="dn"&&i<os.length-1){var y=os[i];os[i]=os[i+1];os[i+1]=y; $("#rows").innerHTML=rowsHtml()}
  else if(a==="del"){ os.splice(i,1); $("#rows").innerHTML=rowsHtml() }
  else if(b.id==="sAdd"){ var n=1; while(os.some(function(o){return o.id==="p"+n})) n++; os.push({id:"p"+n,nama:"",jab:"",foto:""}); $("#rows").innerHTML=rowsHtml(); var ins=$("#rows .in-nama:last-of-type"); var all=document.querySelectorAll("#rows .in-nama"); if(all.length) all[all.length-1].focus(); }
  else if(b.id==="sLogoX"){ draft.logo=""; $("#sLogo").value=""; }
  else if(b.id==="sReset"){
    if(!resetArm){ resetArm=true; b.textContent="Yakin? Klik sekali lagi"; setTimeout(function(){resetArm=false; if(b.isConnected) b.textContent="Hapus data hadir hari ini"},4000); }
    else { applyRecs({}); saveRecs(); ovSet.hidden=true; }
  }
  else if(b.id==="sSave"){
    draft.desa=$("#sDesa").value.trim()||"Desa"; draft.kec=$("#sKec").value.trim(); draft.kab=$("#sKab").value.trim();
    draft.jamMasuk=$("#sJam").value||"07:30"; draft.batas=$("#sBatas").value||"09:00"; draft.info=$("#sInfo").value.trim();
    draft.officials=draft.officials.filter(function(o){return o.nama.trim()}).map(function(o){o.nama=o.nama.trim(); o.jab=o.jab.trim(); return o});
    cfg=draft; cfgSaved=true; saveCfg(); gridSig=""; renderAll(); ovSet.hidden=true;
  }
});

/* ---------- keyboard, idle, fullscreen ---------- */
var buf="", bufT;
function showBuf(){
  var el=$("#buf"); if(!buf){el.hidden=true;return}
  var o=cfg.officials[+buf-1]; el.hidden=false;
  el.innerHTML='No. '+esc(buf)+'<small>'+(o?esc(o.nama)+' · Enter untuk check-in':'tidak ada nomor ini')+'</small>';
  clearTimeout(bufT); bufT=setTimeout(function(){buf="";showBuf()},3500);
}
function anyOpen(){return !$("#ovPick").hidden||!$("#ovSet").hidden}
function goFull(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}) }catch(e){} }
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ $("#ovPick").hidden=true; $("#ovSet").hidden=true; buf=""; showBuf(); return; }
  var tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="select"||tag==="textarea"||anyOpen()||e.ctrlKey||e.metaKey||e.altKey) return;
  if(/^\d$/.test(e.key)){ buf+=e.key; showBuf(); }
  else if(e.key==="Enter"&&buf){ checkin(+buf-1); buf=""; showBuf(); }
  else if(e.key==="Backspace"&&buf){ buf=buf.slice(0,-1); showBuf(); }
  else if(e.key.toLowerCase()==="f"){ goFull(); }
  else if(e.key.toLowerCase()==="s"){ openSet(); }
});
$("#bFull").addEventListener("click",goFull);
$("#bSet").addEventListener("click",openSet);
var idleT; function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(function(){ if(!anyOpen()) document.body.classList.add("idle") },4000); }
["mousemove","mousedown","touchstart","keydown"].forEach(function(ev){addEventListener(ev,wake,{passive:true})});
var rz; addEventListener("resize",function(){clearTimeout(rz); rz=setTimeout(fitGrid,80)});
if(window.ResizeObserver) new ResizeObserver(function(){clearTimeout(rz); rz=setTimeout(fitGrid,80)}).observe($("#grid"));

/* ---------- start ---------- */
renderAll();
tickClock();
wake();
setInterval(tickClock,1000);
initDb();
})();
</script>
