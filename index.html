<style>
:root{
  --bg:#06131a; --panel:#0c1f29; --panel2:#102a36; --line:rgba(190,225,215,.12);
  --fg:#eaf3f0; --muted:#8fa8a6; --gold:#e6b655; --gold2:#f6d98f;
  --hadir:#38e08f; --izin:#58c4ff; --sakit:#b99cff; --dinas:#ffa94d; --belum:#98a9b4; --alpa:#ff5d6c;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;font-size:clamp(13px,calc(.55vw + .6vh),30px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.idle{cursor:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 38s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#0e6a5a;left:-18vmax;top:-22vmax}
.bg i:nth-child(2){background:#143a6e;right:-24vmax;bottom:-28vmax;animation-duration:46s;opacity:.45}
.bg i:nth-child(3){background:#6b4a14;left:38vw;top:30vh;width:34vmax;height:34vmax;opacity:.16;animation-duration:52s}
.bg::after{content:"";position:absolute;inset:0;opacity:.7;
  background:
   radial-gradient(circle at 0 0,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px,
   radial-gradient(circle at 100% 0,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px,
   radial-gradient(circle at 0 100%,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px,
   radial-gradient(circle at 100% 100%,transparent 36%,rgba(230,182,85,.07) 37% 39%,transparent 40%) 0 0/72px 72px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,transparent 25%,#000 100%);mask-image:radial-gradient(ellipse at 50% 40%,transparent 25%,#000 100%)}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

.stage{position:relative;z-index:1;height:100%;display:grid;gap:1.1rem;
  grid-template-columns:clamp(15rem,19vw,26rem) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "side grid" "tick tick";padding-block:1.1rem}

.top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem;
  padding:.9rem 1.4rem;border-radius:1.1rem;border:1px solid var(--line);
  background:linear-gradient(100deg,rgba(16,42,54,.85),rgba(10,28,38,.7));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:1.1rem;min-width:0}
.seal{width:4.6rem;height:4.6rem;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(230,182,85,.18),transparent 70%);box-shadow:0 0 0 1px rgba(230,182,85,.35),0 0 2rem rgba(230,182,85,.18)}
.seal img,.seal svg{width:88%;height:88%;object-fit:contain}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1
